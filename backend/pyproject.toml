[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-backend"
version = "0.1.0"
description = "Backend service for the Grounded adaptive RAG platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.28,<0.29",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<0.31",
  "arq>=0.26,<0.27",
  "psycopg[binary]>=3.2,<4.0",
  "google-auth>=2.38,<3.0",
  "python-multipart>=0.0.9,<0.1",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "boto3>=1.36,<2.0",
  "pypdf>=6.0,<7.0",
  "python-docx>=1.1,<2.0",
  "qdrant-client>=1.13,<1.15",
  "redis>=5.2,<6.0",
  "requests>=2.32,<3.0",
  "structlog>=25.1,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<0.26",
  "ruff>=0.9,<0.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
